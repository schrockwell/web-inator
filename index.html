<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Webinator — ROM-inator Tools</title>
    <link rel="stylesheet" href="./assets/main.css">
</head>

<body>
    <div class="app">
        <header class="nav">
            <div class="masthead">
                <a class="brand" href="./">The Webinator</a>
                <p class="sub">
                    For the
                    <a href="https://www.bigmessowires.com/mac-rom-inator/">Mac ROM-inator V1</a> ~
                    by <a href="https://schrockwell.com" rel="noopener">@schrockwell</a>
                </p>
            </div>
            <nav class="nav-links">
                <a href="./icon/">Boot Icon</a>
                <a href="./sound/">Startup Sound</a>
                <a href="./wallpaper/">Wallpaper</a>
            </nav>
        </header>

        <div class="grid">
            <a class="tile" href="./icon/">
                <span class="icon">
                    <img src="assets/happy-mac.webp" alt="Happy Mac icon" width="64" height="64">
                </span>
                <span class="title">Boot Icon Editor</span>
                <span class="desc">Wipe the smile off your Happy Mac</span>
            </a>

            <a class="tile" href="./sound/">
                <span class="icon">
                    <img src="assets/sound-mac.png" alt="Sound Mac icon" width="64" height="64">
                </span>
                <span class="title">Startup Sound Editor</span>
                <span class="desc">Bong? Chirp? Wilhelm Scream?</span>
            </a>

            <a class="tile" href="./wallpaper/">
                <span class="icon">
                    <img src="assets/bg-mac.png" alt="Wallpaper Mac icon" width="64" height="64">
                </span>
                <span class="title">Wallpaper Ditherer</span>
                <span class="desc">Turn any photo into 1-bit MacPaint wallpaper</span>
            </a>
        </div>
    </div>
</body>

</html>
